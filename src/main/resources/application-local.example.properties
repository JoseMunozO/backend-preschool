# Local development configuration example.
#
# Copy this file and rename the copy to:
#   application-local.properties
#
# The real application-local.properties file is ignored by Git, so each developer
# can keep their own database password and JWT secret locally without uploading
# sensitive information to GitHub.
#
# To run with this local config:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#
# In IntelliJ, set the active Spring profile to:
#   local

spring.datasource.url=jdbc:mysql://localhost:3306/preschool_admin_db_v2?useSSL=false&serverTimezone=Europe/Stockholm&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=CHANGE_ME

app.jwt.secret=CHANGE_ME_WITH_A_LONG_SECRET_AT_LEAST_64_CHARS
app.jwt.expiration-ms=86400000
