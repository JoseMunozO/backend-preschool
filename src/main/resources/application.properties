spring.application.name=backend-preschool

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/preschool_admin_db_v2?useSSL=false&serverTimezone=Europe/Stockholm&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET:change-me-development-jwt-secret-key-with-at-least-64-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
